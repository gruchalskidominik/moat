<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Moat Guardian</title>
<style>
  body{margin:0;background:#1d1d1d;color:#f3f2ee;font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:520px;margin:0 auto;padding:48px 24px 64px;text-align:center}
  h1{font-size:28px;letter-spacing:-.6px;margin:0 0 6px;font-weight:700}
  h2{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#8a8a8e;margin:32px 0 12px;font-weight:600}
  p{color:#c9c8c2;margin:0 0 16px}
  .muted{color:#8a8a8e;font-size:14px}
  .status{display:inline-flex;align-items:center;gap:8px;border:1px solid #3a3a3e;border-radius:999px;padding:6px 14px;font-size:14px;color:#c9c8c2;margin:8px 0 28px}
  .dot{width:8px;height:8px;border-radius:4px;background:#4e4e50}
  .dot.ok{background:#7fa88f}.dot.warn{background:#dc0c37}
  .code{font-size:56px;font-weight:300;letter-spacing:10px;font-variant-numeric:tabular-nums;margin:8px 0 4px;color:#f3f2ee;min-height:72px}
  .gen{background:#c3073f;color:#f3f2ee;border:0;border-radius:14px;height:56px;padding:0 28px;font:600 17px -apple-system,sans-serif;margin:16px 0 8px;cursor:pointer;width:100%;max-width:320px}
  .gen:active{opacity:.75}.gen:disabled{opacity:.4}
  .box{border:1px solid #3a3a3e;border-radius:16px;padding:20px;text-align:left;background:#262628;margin-top:28px}
  .box p{margin:0 0 10px;font-size:15px}
  .err{color:#dc0c37}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
  .stat{border:1px solid #3a3a3e;border-radius:12px;padding:12px;background:#262628;text-align:left}
  .stat b{display:block;font-size:22px;font-weight:600;color:#f3f2ee;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:#8a8a8e;letter-spacing:.04em}
  .list{text-align:left;margin:0;padding:0;list-style:none}
  .list li{border-top:1px solid #3a3a3e;padding:10px 0;font-size:14px;color:#c9c8c2}
  .list li:first-child{border-top:0}
  .list .when{color:#8a8a8e;font-size:12px}
  a{color:#c3073f}
  .cta{margin-top:28px;font-size:14px;color:#8a8a8e}
</style>
</head>
<body>

  <h1 id="title">Moat guardian</h1>
  <p id="sub" class="muted"></p>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">…</span></div>
  <p class="muted" id="sos" style="margin:-20px 0 8px;font-size:14px"></p>
  <p class="muted" id="note" style="margin:0 0 28px;font-size:13px;color:#5f5f66"></p>
  <div id="app">
    <div class="code" id="code">······</div>
    <p class="muted" id="hint"></p>
    <button class="gen" id="gen" type="button"></button>
    <p class="muted" id="left"></p>
  </div>
  <h2 id="statsTitle"></h2>
  <div class="stats" id="stats"></div>
  <ul class="list" id="events"></ul>
  <div class="box">
    <p><strong id="howTitle"></strong></p>
    <p id="how1"></p>
    <p id="how2"></p>
    <p class="muted" id="how3"></p>
  </div>
  <p class="cta"><a id="cta" href="https://apps.apple.com/app/id6811932268"></a></p>
</main>

  const name = params.get("n");
  const lang = (params.get("l") || navigator.language || "en").slice(0, 2).toLowerCase();
  const T = I18N[lang] || I18N.en;
  document.documentElement.lang = lang;
  const $ = (id) => document.getElementById(id);
  $("sub").textContent = T.sub(name);
  $("gen").textContent = T.gen;
  $("hint").textContent = T.hint;
  $("howTitle").textContent = T.howTitle;
  $("how1").textContent = T.how1; $("how2").textContent = T.how2; $("how3").textContent = T.how3;
  $("cta").textContent = T.cta;
  $("note").textContent = T.note;
  $("statsTitle").textContent = T.statsTitle;

  if (!raw || !window.crypto || !crypto.subtle) {
    $("code").textContent = "—"; $("gen").hidden = true;
    $("left").innerHTML = '<span class="err">' + (raw ? T.nocrypto : T.nokey) + "</span>";
    $("statusText").textContent = "—";
    return;
  }

  let bits = 0, value = 0; const bytes = [];
  for (const ch of raw) {
    value = (value << 5) | B32.indexOf(ch); bits += 5;
    if (bits >= 8) { bytes.push((value >>> (bits - 8)) & 255); bits -= 8; }
  }

  async function beatId() {
    const digest = new Uint8Array(await crypto.subtle.digest("SHA-1", new TextEncoder().encode("moat:" + raw)));
    let b = 0, v = 0, out = "";
    for (const byte of digest) {
      v = (v << 8) | byte; b += 8;
      while (b >= 5) { out += B32[(v >>> (b - 5)) & 31]; b -= 5; }
    }
    if (b > 0) out += B32[(v << (5 - b)) & 31];
    return out.slice(0, 32);
  }

  async function codeHash(code) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw + ":" + code));
    return [...new Uint8Array(buf)].map((x) => x.toString(16).padStart(2, "0")).join("");
  }

  function randomCode() {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return String(a[0] % 1000000).padStart(6, "0");
  }

  let expireTimer = null;
  $("gen").onclick = async () => {
    $("gen").disabled = true;
    $("left").textContent = "";
    try {
      const code = randomCode();
      const hash = await codeHash(code);
      const id = await beatId();
      const expires = new Date(Date.now() + 10 * 60_000).toISOString();
      const r = await fetch(CODES, {
        method: "POST",
        headers: {
          apikey: KEY, Authorization: "Bearer " + KEY,
          "Content-Type": "application/json", Prefer: "return=minimal",
        },
        body: JSON.stringify({ id, code_hash: hash, expires_at: expires }),
      });
      if (!r.ok) throw new Error("insert");
      $("code").textContent = code.slice(0, 3) + " " + code.slice(3);
      $("left").textContent = T.made(new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
      if (navigator.clipboard) navigator.clipboard.writeText(code).catch(() => {});
      const end = Date.now() + 10 * 60_000;
      if (expireTimer) clearInterval(expireTimer);
      expireTimer = setInterval(() => {
        const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
        $("hint").textContent = left ? T.countdown(left) : T.hint;
        if (!left) clearInterval(expireTimer);
      }, 250);
    } catch {
      $("code").textContent = "······";
      $("left").innerHTML = '<span class="err">' + T.netFail + "</span>";
    } finally {
      $("gen").disabled = false;
    }
  };

  async function status() {
    try {
      const id = await beatId();
      const r = await fetch(`${BEATS}?id=eq.${id}&select=ok,at,v,sos`, { headers: { apikey: KEY } });
      const rows = await r.json();
      const dot = $("dot"), txt = $("statusText");
      if (!rows.length) { txt.textContent = T.none; return; }
      const row = rows[0];
      const mins = Math.max(0, Math.round((Date.now() - new Date(row.at).getTime()) / 60000));
      const ago = T.ago(mins);
      if (row.v === "off") { txt.textContent = T.off; dot.className = "dot"; return; }
      if (!row.ok) { txt.textContent = T.revoked(ago); dot.className = "dot warn"; return; }
      const sosMins = row.sos ? Math.max(0, Math.round((Date.now() - new Date(row.sos).getTime()) / 60000)) : null;
      $("sos").textContent = sosMins !== null && sosMins < 14 * 1440 ? T.sos(T.ago(sosMins)) : "";
      if (mins > 48 * 60) { txt.textContent = T.silent(ago); dot.className = "dot warn"; return; }
      if (mins > 12 * 60) { txt.textContent = T.quiet(ago); dot.className = "dot ok"; return; }
      txt.textContent = T.okNow(ago); dot.className = "dot ok";
    } catch { $("statusText").textContent = T.err; }
  }

  async function loadEvents() {
    try {
      const id = await beatId();
      const since = new Date(Date.now() - 30 * 86400000).toISOString();
      // Client-side retention: ignore events older than 90 days if cron is absent.
      const hard = new Date(Date.now() - 90 * 86400000).toISOString();
      const r = await fetch(`${RPC_EVENTS}`, {
        method: "POST",
        headers: { apikey: KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ p_id: id }),
      });
      let rows = await r.json();
      if (!Array.isArray(rows)) rows = [];
      rows = rows.filter((e) => e.at >= since);
      const wallKinds = new Set(["wall_off", "wall_delete", "drop_all"]);
      let breath = 0, code = 0, emer = 0, walls = 0;
      for (const e of rows) {
        if (e.kind === "breath_unlock") breath++;
        else if (e.kind === "code_unlock") code++;
        else if (e.kind === "emergency") emer++;
        if (wallKinds.has(e.kind)) walls++;
      }
      $("stats").innerHTML = [
        ["sBreath", breath], ["sCode", code], ["sEmer", emer], ["sWalls", walls],
      ].map(([k, n]) => `<div class="stat"><b>${n}</b><span>${T[k]}</span></div>`).join("");
      const list = rows.slice(0, 20);
      if (!list.length) {
        $("events").innerHTML = `<li class="muted">${T.evEmpty}</li>`;
        return;
      }
      $("events").innerHTML = list.map((e) => {
        const label = (T.kind[e.kind] || e.kind) + (e.wall ? ` · ${e.wall}` : "");
        const when = new Date(e.at).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
        return `<li><div>${label}</div><div class="when">${when}</div></li>`;
      }).join("");
    } catch {
      $("stats").innerHTML = "";
      $("events").innerHTML = `<li class="err">${T.err}</li>`;
    }
  }

  status(); loadEvents();
  setInterval(status, 60000);
  setInterval(loadEvents, 120000);
})();
</script>
